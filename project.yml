name: SendOnly
options:
  bundleIdPrefix: com.sendonly
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""  # Fill in your team ID

targets:
  SendOnly:
    type: application
    platform: macOS
    sources:
      - path: SendOnly
        excludes:
          - "**/*.xcassets"
      - path: SendOnly/Resources/Assets.xcassets
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sendonly.app
        INFOPLIST_FILE: SendOnly/Info.plist
        CODE_SIGN_ENTITLEMENTS: SendOnly/SendOnly.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    entitlements:
      path: SendOnly/SendOnly.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.sendonly.app

  SendOnlyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SendOnlyTests
    dependencies:
      - target: SendOnly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sendonly.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SendOnly.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SendOnly"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SendOnly:
    build:
      targets:
        SendOnly: all
        SendOnlyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SendOnlyTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
